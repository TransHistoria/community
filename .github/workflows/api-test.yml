name: API Integration Tests

on:
  push:
    paths:
      - "worker/**"
      - ".github/workflows/api-test.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/api-test.yml"
  workflow_dispatch:

jobs:
  api-test:
    name: wrangler dev + endpoint tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # ── Local secrets for wrangler dev ─────────────────────────────────────
      # JWT_SECRET must be set so signJwt / verifyJwt work locally.
      # ADMIN_EMAILS seeds admin@ci.test so the test admin user gets ADMIN tier
      # on first verify (but we pre-seed directly via SQL, so this is a fallback).
      - name: Write .dev.vars
        run: |
          cat > .dev.vars <<'EOF'
          JWT_SECRET=ci-test-secret-do-not-use-in-production
          ADMIN_EMAILS=admin@ci.test
          EOF

      # ── Apply schema ────────────────────────────────────────────────────────
      - name: Apply D1 migrations (local)
        run: npx wrangler d1 migrations apply transcommunity --local

      # ── Seed test fixture data ──────────────────────────────────────────────
      - name: Seed test data
        run: npx wrangler d1 execute transcommunity --local --file test/seed.sql

      # ── Start wrangler dev ──────────────────────────────────────────────────
      - name: Start wrangler dev
        run: npx wrangler dev --local --port 8787 &
        env:
          # Suppress Cloudflare telemetry in CI
          WRANGLER_SEND_METRICS: "false"

      # ── Run all endpoint tests ──────────────────────────────────────────────
      - name: Run API tests
        run: node test/api.test.mjs
        env:
          API_BASE: "http://localhost:8787"
          # Give wrangler dev up to 30 s to become ready (handled inside the
          # test script via its waitReady() poll loop).
